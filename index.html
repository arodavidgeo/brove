<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F1E6" />
    
    <!-- Primary Meta Tags -->
    <title>BROVE : Custom Apparel & T-Shirt Printing | Wear Your Identity</title>
    <meta name="title" content="BROVE : Custom Apparel & T-Shirt Printing | Wear Your Identity" />
    <meta name="description" content="BROVE prints custom apparel in DTF and embroidery. From custom T-shirts and hoodies to premium corporate & college team wear. Minimum order 5 pieces. Delivered across India via ST Courier." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="BROVE : Custom Apparel & T-Shirt Printing" />
    <meta property="og:description" content="Wear Your Identity. Premium fabrics, vivid DTF prints, and precise embroidery for colleges, companies, teams, and individuals." />
    <meta property="og:image" content="/favicon.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="BROVE : Custom Apparel & T-Shirt Printing" />
    <meta property="twitter:description" content="Wear Your Identity. Premium fabrics, vivid DTF prints, and precise embroidery for colleges, companies, teams, and individuals." />

    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Fonts: Bodoni Moda, Barlow Condensed, DM Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Bodoni+Moda:opsz,wght@6..96,600;6..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />

    <!-- Early Theme Initialization to Prevent Flash of Wrong Theme -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('brove-theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-surface-paper dark:bg-[#141412] text-text-primary dark:text-[#F4F1E6] font-sans antialiased selection:bg-primary-container selection:text-text-primary min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
